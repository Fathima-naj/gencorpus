<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body{
             margin: 63px;
        }
    </style>
</head>
<body>
    <form>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="Enter email"/>
        </div>
         <div class="mb-3">
            <label class="form-label">Password
            </label>
            <input type="password" class="form-control" placeholder="Enter password"/>
        </div>

        <div class="form-check">
            <input type="checkbox" class="form-check-input"/>
            <label class="form-check-label">Css</label>
        </div>
        <div class="form-check">
            <input type="checkbox" class="form-check-input"/>
            <label class="form-check-label">Html</label>
        </div>
        <div class="form-check">
            <input type="radio" class="form-check-input" name="gender"/>
            <label class="form-check-label">Male</label>
        </div>
         <div class="form-check">
            <input type="radio" class="form-check-input" name="gender"/>
            <label class="form-check-label">Female</label>
        </div>

        <div class="form-check form-switch">
             <input type="checkbox" class="form-check-input"/>
             <label class="form-check-label">Enable notification</label>
        </div>

        <div class="input-group mb-3">
            <span class="input-group-text">@</span>
            <input type="text" class="form-control" placeholder="username"/>
            
        </div>

        <div class="form-floating">
          <input class="form-control" type="text" placeholder="username"/>
         
             <label>Enter Username</label>
        </div>

        <div class="mb-3">
            <label class="form-label">Valid Input</label>
            <input type="text" class="form-control is-valid" placeholder="valid input"/>
            <div class="valid-feedback">success</div>
        </div>

        <div class="mb-3">
            <label class="form-label">Invalid Input</label>
            <input type="text" class="form-control is-invalid" placeholder="invalid input"/>
            <div class="invalid-feedback">Error</div>
        </div>
        <button class="btn btn-primary">submit</button>
    </form>
</body>
</html>
