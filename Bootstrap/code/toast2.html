<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stacked Toast Fix</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="p-4">

  <!-- BUTTON -->
  <button class="btn btn-primary" id="ToastBtn2">
    Show stacked toast
  </button>

  <!-- TOAST CONTAINER -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer">

    <!-- TEMPLATE TOAST (hidden, used for cloning) -->
    <div class="toast" id="idToast2" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="toast-header">
        <strong class="me-auto">Notification</strong>
        <small>just now</small>
        <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
      </div>
      <div class="toast-body">
        This is a stacked toast 
      </div>
    </div>

  </div>

  <script>
    const toastTrigger = document.getElementById("ToastBtn2");
    const container = document.getElementById("toastContainer");
    const template = document.getElementById("idToast2");

    toastTrigger.addEventListener("click", () => {
      // clone toast
      const newToast = template.cloneNode(true);

      // remove duplicate id
      newToast.removeAttribute("id");

      // add to container
      container.appendChild(newToast);

      // create bootstrap toast
      const toast = new bootstrap.Toast(newToast);

      // show it
      toast.show();

      // auto remove after hidden
      newToast.addEventListener("hidden.bs.toast", () => {
        newToast.remove();
      });
    });
  </script>

</body>
</html>
