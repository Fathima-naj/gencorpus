<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Tabs with ScrollSpy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .tab-pane {
      height: 200px;       /* Scrollable height */
      overflow-y: auto;    /* Enable vertical scroll */
      border: 1px solid #ccc;
      padding: 1rem;
      margin-top: 1rem;
    }
    .section {
      height: 100px;
      margin-bottom: 1rem;
      background: #f5f5f5;
      border: 1px dashed #999;
      padding: 0.5rem;
    }
  </style>
</head>
<body class="p-3">

<h3>Tabs with ScrollSpy</h3>

<!-- Tabs -->
<ul class="nav nav-tabs" id="nav-tab">
  <li class="nav-item">
    <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab1">Tab 1</button>
  </li>
  <li class="nav-item">
    <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab2">Tab 2</button>
  </li>
</ul>

<!-- Tab Contents -->
<div class="tab-content">
<div class="tab-pane fade show active " id="tab1"
     data-bs-spy="scroll"
     data-bs-target="#scrollNav1"
     data-bs-offset="0"
     >

  <nav id="scrollNav1" class="nav flex-column ">
    <a class="nav-link " href="#s1">Section 1</a>
    <a class="nav-link" href="#s2">Section 2</a>
    <a class="nav-link" href="#s3">Section 3</a>
  </nav>

  <div id="s1" class="section">Tab 1 - Section 1</div>
  <div id="s2" class="section">Tab 1 - Section 2</div>
  <div id="s3" class="section">Tab 1 - Section 3</div>
</div>
  <div class="tab-pane fade" id="tab2"
     data-bs-spy="scroll"   
     data-bs-target="#scrollNav2"
     data-bs-offset="0"
     tabindex="0">

  <nav id="scrollNav2" class="nav flex-column">
    <a class="nav-link" href="#sA">Section A</a>
    <a class="nav-link" href="#sB">Section B</a>
    <a class="nav-link" href="#sC">Section C</a>
  </nav>

  <div id="sA" class="section">Tab 2 - Section A</div>
  <div id="sB" class="section">Tab 2 - Section B</div>
  <div id="sC" class="section">Tab 2 - Section C</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Refresh ScrollSpy when switching tabs
 
</script>

</body>
</html>
