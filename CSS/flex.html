<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>
    <style>
        .div1{
            display: flex;
            background-color: grey;
            flex-direction: row;
            padding: 10px;
            gap: 2px;
            flex-wrap: wrap;
            height: 200px;
            
             
            }
            .div2{
                margin-top: 10px;
                 display: flex;
            background-color: grey;
            flex-direction: row;
            padding: 10px;
            gap: 2px;
            width: 300px;
            }
    </style>
</head>
<body>
    <div class="div1">
        <div style="background-color: rgb(222, 197, 246); padding: 3px; width: 100px; align-self: flex-start; order: 3;">1</div>
        <div style="background-color: rgb(222, 197, 246);  padding: 3px; width: 100px; align-self: center; order: 1;">2</div>
        <div style="background-color: rgb(222, 197, 246);  padding: 3px; width: 100px; order: 2;">3</div>
        
    </div>
    <div class="div2">
        <div style="background-color: rgb(222, 197, 246);  padding: 3px; width: 300px; flex-shrink: 1;">1</div>
        <div style="background-color: rgb(222, 197, 246);  padding: 3px; width: 200px; flex-shrink: 0;">2</div>
    </div>
</body>
</html>
