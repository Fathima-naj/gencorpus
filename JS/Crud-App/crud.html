<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CRUD App - Image Upload</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css"/>
  <style>
    body {
      background: #f4f6f9;
    }
    .card img {
      height: 200px;
      object-fit: cover;
    }
   
  </style>
</head>
<body>

<div class="container py-5">
  <div class="d-flex justify-content-between mb-4">
    <h2>User Management</h2>
    <button class="btn btn-add" onclick="openAddModal()"><i class="bi bi-plus-circle"></i></button>
  </div>

 <div class="table-responsive">
  <table class="table table-striped table-hover align-middle shadow">
    <thead class="table-success">
      <tr>
        <th>Profile</th>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Login Date</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="tableContainer"></tbody>
  </table>
</div>
</div>

<!-- Add/Edit Modal -->
<div class="modal fade" id="userModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">User Form</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="userForm">
          <input type="hidden" id="userIndex">

         <div class="mb-3 text-center">

        <!-- Hidden File Input -->
        <input type="file" id="profileImage" accept="image/*" hidden>

        <!-- Clickable Profile Circle -->
        <div class="profile-upload" onclick="document.getElementById('profileImage').click()">
            <img id="previewImage" src="" alt="">
            <i class="bi bi-person-circle" id="defaultIcon"></i>
        </div>

        </div>

          <div class="mb-3">
            <label>Name</label>
            <input type="text" class="form-control" id="name" required>
          </div>

          <div class="mb-3">
            <label>Email</label>
            <input type="email" class="form-control" id="email" required>
          </div>

          <div class="mb-3">
            <label>Phone</label>
            <input type="tel" class="form-control" id="phone" required>
          </div>

          <div class="mb-3">
            <label>Login Date</label>
            <input type="date" class="form-control" id="loginDate" required>
          </div>
          <button type="submit" class="btn btn-success w-100">Save</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- View Modal -->
<div class="modal fade" id="viewModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-body" id="viewContent"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
let users = JSON.parse(localStorage.getItem("users")) || [];
let uploadedImage = "";

const userModal = new bootstrap.Modal(document.getElementById("userModal"));
const viewModal = new bootstrap.Modal(document.getElementById("viewModal"));

function openAddModal() {
  document.getElementById("userForm").reset();
  document.getElementById("userIndex").value = "";

  const preview = document.getElementById("previewImage");
  const icon = document.getElementById("defaultIcon");

  preview.style.display = "none";
  preview.src = "";
  icon.style.display = "block";  

  uploadedImage = "";
  userModal.show();
}

function saveToLocalStorage() {
  localStorage.setItem("users", JSON.stringify(users));
}

function renderTable() {
  const container = document.getElementById("tableContainer");
  container.innerHTML = "";

  users.forEach((user, index) => {
    container.innerHTML += `
      <tr>
        <td>
          <img src="${user.profileImage || 'https://via.placeholder.com/60'}"
               style="width:60px; height:60px; object-fit:cover; border-radius:50%;">
        </td>
        <td>${user.name}</td>
        <td>${user.email}</td>
        <td>${user.phone}</td>
        <td>${user.loginDate}</td>
        <td>
          <button class="btn btn-info btn-sm" onclick="viewUser(${index})">
            <i class="bi bi-eye"></i>
          </button>
          <button class="btn btn-warning btn-sm" onclick="editUser(${index})">
            <i class="bi bi-pencil"></i>
          </button>
          <button class="btn btn-danger btn-sm" onclick="deleteUser(${index})">
            <i class="bi bi-trash"></i>
          </button>
        </td>
      </tr>
    `;
  });
}

document.getElementById("profileImage").addEventListener("change", function(e) {
  const file = e.target.files[0];
  const reader = new FileReader();

  reader.onload = function(event) {
    uploadedImage = event.target.result;
    const preview = document.getElementById("previewImage");
    preview.src = uploadedImage;
    preview.style.display = "block";
   
  };

  if (file) {
    reader.readAsDataURL(file);
  }
});

document.getElementById("userForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const index = document.getElementById("userIndex").value;

  const user = {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    phone: document.getElementById("phone").value,
    loginDate: document.getElementById("loginDate").value,
    profileImage: uploadedImage
  };

  if (index === "") {
    users.push(user);
  } else {
    users[index] = user;
  }

  saveToLocalStorage();
  renderTable();
  userModal.hide();
});

function editUser(index) {
  const user = users[index];

  document.getElementById("name").value = user.name;
document.getElementById("email").value = user.email;
document.getElementById("phone").value = user.phone;
document.getElementById("loginDate").value = user.loginDate;

  document.getElementById("userIndex").value = index;

  const preview = document.getElementById("previewImage");
  const icon = document.getElementById("defaultIcon");

  if (user.profileImage) {
    uploadedImage = user.profileImage;
    preview.src = user.profileImage;
    preview.style.display = "block";
    icon.style.display = "none";
  } else {
    preview.style.display = "none";
    icon.style.display = "block";
  }

  userModal.show();
}
function deleteUser(index) {
  if (confirm("Are you sure?")) {
    users.splice(index, 1);
    saveToLocalStorage();
    renderTable();
  }
}

function viewUser(index) {
  const user = users[index];
  document.getElementById("viewContent").innerHTML = `
    <div class="text-center">
      <img src="${user.profileImage}" class="img-fluid mb-3" style="height:200px; object-fit:cover;">
      <h4>${user.name}</h4>
      <p>Email: ${user.email}</p>
      <p>Phone: ${user.phone}</p>
      <p>Login Date: ${user.loginDate}</p>
      <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
    </div>
  `;
  viewModal.show();
}

renderTable();
</script>

</body>
</html>
