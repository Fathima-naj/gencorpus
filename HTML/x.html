<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Webpage</title>

<style>
body{
  font-family: Arial;
  margin:0;
  background:#f2f2f2;
}

/* Header */
header{
  background:#04AA6D;
  color:white;
  padding:15px;
  text-align:center;
}

/* Navigation */
nav{
  background:#333;
  padding:10px;
  text-align:center;
}

nav a{
  color:white;
  margin:10px;
  text-decoration:none;
}

/* Main Content */
main{
  padding:20px;
}

/* Table */
table, th, td{
  border:1px solid black;
  border-collapse:collapse;
}

th, td{
  padding:10px;
}

/* Form */
form{
  margin-top:20px;
  background:white;
  padding:15px;
  border-radius:8px;
}

input, select{
  margin:5px 0;
  padding:5px;
  width:100%;
}

/* Footer */
footer{
  background:#333;
  color:white;
  text-align:center;
  padding:10px;
  margin-top:20px;
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
  <h1>My Student Page</h1>
</header>

<!-- NAV -->
<nav>
  <a href="#">Home</a>
  <a href="#table">Table</a>
  <a href="#form">Form</a>
</nav>

<!-- MAIN -->
<main>

  <!-- TABLE SECTION -->
  <section id="table">
    <h2>Student Table</h2>

    <table style="width:100%">
      <caption>Student Details</caption>

      <tr>
        <th colspan="2">Name</th>
        <th>Age</th>
      </tr>

      <tr>
        <td rowspan="2">Fathima</td>
        <td>Naja</td>
        <td>20</td>
      </tr>

      <tr>
        <td>Student</td>
        <td>20</td>
      </tr>

      <tr>
        <td>Amina</td>
        <td>K</td>
        <td>21</td>
      </tr>
    </table>
  </section>

  <!-- FORM SECTION -->
  <section id="form">
    <h2>Registration Form</h2>

    <form>

      <label>Name:</label>
      <input type="text" placeholder="Enter name">

      <label>Email:</label>
      <input type="email" placeholder="Enter email">

      <label>Age:</label>
      <input type="number" min="18" max="30">

      <label>Course:</label>
      <select>
        <option>MERN</option>
        <option>Python</option>
        <option>Java</option>
      </select>

      <label>Gender:</label><br>
      <input type="radio" name="gender"> Male
      <input type="radio" name="gender"> Female
      <br><br>

      <label>Skills:</label><br>
      <input type="checkbox"> HTML
      <input type="checkbox"> CSS
      <input type="checkbox"> JavaScript
      <br><br>

      <button type="submit">Submit</button>
      <button type="reset">Reset</button>
      <button type="button">Click</button>

    </form>
  </section>

</main>

<!-- FOOTER -->
<footer>
  <p>© 2026 Student Page</p>
</footer>

</body>
</html>
