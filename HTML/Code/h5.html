<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      th,td{
        padding: 12px;
      }
      table{
        border-spacing: 10px;
      }
    </style>
</head>
<body>
    <table border="2" style=" width:50% ;" >
        <tr style="height: 50px;">
            <th style="width: 50%;">Name</th>
            <th>Age</th>
        </tr>
        <tr>
            <td rowspan="2"> Fathima</td>
            <td>20</td>
        </tr>
        <tr>
            
            <td>25</td>
        </tr>
    </table>
    <h2>vertical header</h2>
    
    <table border="2" style="border-collapse: collapse; width:50% ;" >
        <tr>
            <th style="text-align: center;">Name</th>
            <td>Arun</td>
        </tr>
        <tr>
            <th>Age</th>
            <td>27</td>
        </tr>
    </table>
    <h2>Colspan</h2>
     <table border="2" style="border-collapse: collapse; width:50% ;" >
        <caption>Student Table</caption>
        <tr style="height: 50px;">
            <th style="width: 50%;" colspan="2">Name</th>
            <th>Age</th>
        </tr>
        <tr>
            <td>Fathima</td>
            <td>Arun</td>
            <td>20</td>
        </tr>
        <tr>
            <td>Sara</td>
            <td>Ishal</td>
            <td>25</td>
        </tr>
    </table><br><br>


    <h2>Normal Button</h2>
    <button type="button">Click</button><br>
    <h2>Submit button</h2>
    <form>
        <input type="text">
        <button type="submit">Submit</button>
    </form><br>
    <h2>Reset button</h2>
    <form>
        <input type="text" value="Hello">
        <button type="reset">Reset</button>
    </form><br>
</body>
</html>
